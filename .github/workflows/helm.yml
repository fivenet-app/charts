name: Helm Publish
on:
  push:
    branches:
      - main

jobs:
  helm-release:
    # Depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Notify application repository
        env:
          GH_TOKEN: ${{ secrets.FIVENET_REPO_TOKEN }}
        run: |
          chart_version="$(sed -n 's/^version: *//p' charts/fivenet/Chart.yaml | head -1)"
          app_version="$(sed -n 's/^appVersion: *//p' charts/fivenet/Chart.yaml | head -1 | sed 's/^\"//; s/\"$//')"

          gh api repos/fivenet-app/fivenet/dispatches \
            --method POST \
            -f event_type=chart-release \
            -f "client_payload[chart_version]=$chart_version" \
            -f "client_payload[app_version]=$app_version"
